name: Testes de API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/gestao-de-alunos-test
      BASE_URL: http://localhost:3000
      # credenciais do admin criado pelo seed (documentadas no README)
      ADMIN_EMAIL: admin@escola.com
      ADMIN_SENHA: admin123

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # os testes externos batem na API via HTTP, então ela precisa estar no ar antes do mocha
      - name: Subir a API em segundo plano
        run: npm start &

      - name: Aguardar a API responder
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ > /dev/null && echo "API no ar" && exit 0
            sleep 1
          done
          echo "A API não subiu em 30s" && exit 1

      - name: Executar testes
        run: npm test
